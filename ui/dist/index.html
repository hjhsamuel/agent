<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAgent · 聊天助手</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><div class="brand">✳ <strong>CAgent</strong><small>你的智能工作伙伴</small></div><button id="new" class="primary">＋ 新建对话</button><p class="label">最近对话</p><nav id="sessions"></nav><button id="more">加载更多会话</button><button id="settings">⚙ 连接与认证</button></aside>
<main><header><div><strong id="title">新对话</strong><small id="status">准备就绪</small></div><button id="delete" hidden>删除对话</button></header><div id="notice" role="alert" hidden></div><section id="messages" aria-label="聊天消息"><div class="welcome"><span>✳</span><h1>有什么可以帮你？</h1><p>从一个问题开始，让想法更进一步。</p></div></section><div id="inputs"></div><form id="composer"><textarea id="prompt" rows="3" placeholder="输入消息，Enter 发送，Shift + Enter 换行" aria-label="消息内容" required></textarea><footer><span>CAgent · AI 回答仅供参考</span><button id="send" class="primary">发送 ↑</button></footer></form></main>
<dialog id="config"><form method="dialog"><h2>连接与认证</h2><p>使用业务系统签发的 JWT。Cookie 名称需与后端 CAGENT_SERVER_HEADER 一致。</p><label>Cookie 名称<input id="cookieName" value="cagent_token" required pattern="[A-Za-z0-9_-]+"></label><label>JWT<input id="token" type="password" autocomplete="off" placeholder="粘贴有效 JWT；留空保留已有 Cookie"></label><p>令牌仅写入当前浏览器的会话 Cookie，不保存到 localStorage。</p><div class="actions"><button value="cancel" formnovalidate>取消</button><button id="save" value="save" class="primary">保存并连接</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
