        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 提交消息失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 发送会话消息
      tags:
      - 会话
  /v1/session/stream:
    get:
      description: |-
        未传 id 时为当前用户创建临时会话，传入 id 时订阅已有会话。
        首个 init 事件的 data 为会话 ID；后续事件包含 id、event、data，event 类型为 content、reasoning、hitl 或 end。
        hitl 事件的 data 为包含 id 和 content 的 JSON 字符串；seq 用于断线重连，传入最后收到的事件序号。
        建立事件流前的错误返回 JSON；事件流开始后的错误通过关闭连接结束，不再返回 JSON。
      parameters:
      - description: 会话 ID，不传则创建临时会话
        in: query
        name: id
        type: string
      - default: 0
        description: 最后收到的 SSE 事件序号，0 表示首次连接
        in: query
        minimum: 0
        name: seq
        type: integer
      produces:
      - text/event-stream
      - application/json
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "400":
          description: 指定会话不存在
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 创建、查询会话或建立事件流失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 订阅会话事件流
      tags:
      - 会话
