definitions:
  common.Response:
    properties:
      code:
        type: integer
      data:
        type: any
      message:
        type: string
    type: object
  entities.AddAgentGroupReq:
    properties:
      description:
        type: string
      level:
        description: 智能程度
        type: integer
      name:
        type: string
      prompt:
        type: string
    type: object
  entities.AddApiKeyReq:
    properties:
      key:
        description: api key
        type: string
      name:
        description: 名称，仅用于展示
        type: string
      weight:
        description: 权重
        type: integer
    type: object
  entities.AddMainAgentReq:
    properties:
      description:
        type: string
      name:
        type: string
      prompt:
        type: string
    type: object
  entities.AddModelReq:
    properties:
      context_limit:
        description: 上下文限制
        type: integer
      level:
        description: 智能程度。[0, 4]
        type: integer
      name:
        description: 模型名称，例如：glm-5.3，deepseek-v4-pro
        type: string
      provider:
        description: 供应商名称，仅用于展示，例如：GLM、DeepSeek
        type: string
      reasoning:
        $ref: '#/definitions/entities.KeyValue'
        description: 深度思考
      type:
        description: 模型类型。chat：对话模型；embedding：嵌入模型
        type: string
      url:
        description: 地址
        type: string
    type: object
  entities.AddSubAgentReq:
    properties:
      description:
        type: string
      level:
        description: 智能程度
        type: integer
      name:
        type: string
      prompt:
        type: string
    type: object
  entities.AddToolReq:
    properties:
      agent:
        description: agent id
        type: string
      kind:
        description: '类型。0：local tool; 1: a2a; 2: mcp; 3: skill'
        type: integer
      name:
        description: 名称
        type: string
      url:
        description: 远程服务地址，压缩包下载地址
        type: string
    type: object
  entities.AgentInfo:
    properties:
      created_at:
        description: 创建时间
        type: integer
      description:
        description: 描述
        type: string
      id:
        description: agent id
        type: string
      level:
        description: 智能程度
        type: integer
      name:
        description: 名称
        type: string
      prompt:
        description: 提示词
        type: string
      type:
        description: 类型
        type: integer
    type: object
  entities.ApiKeyInfo:
    properties:
      enable:
        description: 是否可用
        type: boolean
      id:
        description: api key id
        type: integer
      name:
        description: 名称
        type: string
      version:
        description: 密钥版本
        type: integer
      weight:
        description: 权重
        type: integer
    type: object
  entities.ChatReq:
    properties:
      content:
        description: 对话消息
        type: string
    type: object
  entities.GenerateSecretRsp:
    properties:
      version:
        description: 密钥版本
        type: integer
    type: object
  entities.GetChatMessagesRsp:
    properties:
      data:
        items:
          $ref: '#/definitions/entities.MessageInfo'
        type: array
      offset:
        description: 消息索引
        type: integer
    type: object
  entities.GetModelsRsp:
    properties:
      enable:
        description: 是否可用
        type: boolean
      id:
        description: model id
        type: string
      level:
        description: 智能程度
        type: integer
      name:
        description: 模型
        type: string
      provider:
        description: 供应商
        type: string
      type:
        description: 类型
        type: string
    type: object
  entities.GetSessionListRsp:
    properties:
      data:
        items:
          $ref: '#/definitions/entities.SessionBase'
        type: array
      offset:
        description: 下次检索使用的索引
        type: string
    type: object
  entities.GetSubAgentsRsp:
    properties:
      data:
        items:
          $ref: '#/definitions/entities.AgentInfo'
        type: array
      offset:
        description: 下次检索游标
        type: string
    type: object
  entities.GetToolInfoRsp:
    properties:
      agent_id:
        description: agent id
        type: string
      agent_name:
        description: agent 名称
        type: string
      created_at:
        description: 创建时间
        type: integer
      creator:
        description: 创建者
        type: string
      id:
        description: tool id
        type: string
      name:
        description: 名称
        type: string
      state:
        description: 状态
        type: integer
      type:
        description: 类型
        type: integer
    type: object
  entities.GetToolListReq:
    properties:
      agent:
        description: 关联 agent id，为空时表示检索未关联的
        type: string
      limit:
        description: 最大返回数量
        type: integer
      offset:
        description: 检索游标
        type: string
      state:
        description: 状态
        type: integer
      type:
        description: 类型
        type: integer
    type: object
  entities.GetToolListRsp:
    properties:
      data:
        items:
          $ref: '#/definitions/entities.ToolOfList'
        type: array
      offset:
        description: 下次检索使用的游标
        type: string
    type: object
  entities.InputRequiredReq:
    properties:
      call_id:
        description: 任务 id
        type: string
      content:
        description: 用户补充内容
        type: string
    type: object
  entities.KeyValue:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  entities.MessageInfo:
    properties:
      content:
        description: 内容
        type: string
      created_at:
        description: 创建时间
        type: integer
      role:
        description: 角色
        type: string
    type: object
  entities.ModifyAgentReq:
    properties:
      description:
        type: string
      level:
        type: integer
      name:
        type: string
      prompt:
        type: string
    type: object
  entities.SessionBase:
    properties:
      created_at:
        description: 创建时间
        type: integer
      id:
        description: 会话 id
        type: string
      name:
        description: 会话标题
        type: string
      state:
        description: 状态。1：运行中；2：结束；3：等待用户输入；5：输入已就绪
        type: integer
      updated_at:
        description: 最后对话时间
        type: integer
    type: object
  entities.ToolOfList:
    properties:
      created_at:
        description: 创建时间
        type: integer
      creator:
        description: 创建者
        type: string
      id:
        description: tool id
        type: string
      link:
        description: 是否关联
        type: boolean
      name:
        description: 名称
        type: string
      state:
        description: 状态
        type: integer
      type:
        description: 类型
        type: integer
    type: object
  entities.UpdateApiKeyReq:
    properties:
      enable:
        description: 是否可用
        type: boolean
      name:
        description: 名称
        type: string
      upgrade:
        description: 密钥轮换
        type: boolean
      weight:
        description: 权重
        type: integer
    type: object
  entities.UpdateModelReq:
    properties:
      context_limit:
        description: 上下文限制
        type: integer
      enable:
        description: 是否可用
        type: boolean
      level:
        description: 智能程度
        type: integer
      name:
        description: 模型名称
        type: string
      provider:
        description: 供应商
        type: string
      reasoning:
        $ref: '#/definitions/entities.KeyValue'
        description: 深度思考
      url:
        description: 地址
        type: string
    type: object
  entities.UpdateToolReq:
    properties:
      agent:
        description: agent id
        type: string
      name:
        description: 名称
        type: string
      url:
        description: 地址
        type: string
    type: object
  entities.UpdateToolStateReq:
    properties:
      state:
        description: 状态
        type: integer
    type: object
  entities.WaitInputInfo:
    properties:
      content:
        description: 提示内容
        type: string
      id:
        description: call id
        type: string
    type: object
info:
  contact: {}
paths:
  /v1/agent/{id}:
    delete:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 必填参数缺失或参数无效
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 删除 Agent失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 删除 Agent
      tags:
      - Agent
    put:
      consumes:
      - application/json
      description: 按需更新配置；level 为 0（低）、1（中）或 2（高）。
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新 Agent参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.ModifyAgentReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 必填参数缺失或参数无效
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 更新 Agent失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 更新 Agent
      tags:
      - Agent
  /v1/agent/{id}/sub:
    get:
      description: 按 Agent ID 升序分页，使用返回的 offset 查询下一页。
      parameters:
      - description: 父级 Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 上一页返回的游标，首次查询不传
        in: query
        name: offset
        type: string
      - description: 最大返回数量，0 表示不限制
        in: query
        maximum: 50
        minimum: 0
        name: limit
        type: integer
      - description: Agent 类型：1 为分组，2 为子 Agent
        enum:
        - 1
        - 2
        in: query
        name: type
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/entities.GetSubAgentsRsp'
              type: object
        "400":
          description: 必填参数缺失或参数无效
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 获取子 Agent 列表失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 获取子 Agent 列表
      tags:
      - Agent
    post:
      consumes:
      - application/json
      description: 在主 Agent 或分组下创建子 Agent；name、description、prompt 必填。
      parameters:
      - description: 父级 Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 新增子 Agent参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.AddSubAgentReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 为 ID
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 必填参数缺失或参数无效
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 新增子 Agent失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 新增子 Agent
      tags:
      - Agent
  /v1/agent/group:
    post:
      consumes:
      - application/json
      description: 创建主 Agent 下的分组；name、description、prompt 必填。
      parameters:
      - description: 新增 Agent 分组参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.AddAgentGroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 为 ID
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 必填参数缺失或参数无效
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 新增 Agent 分组失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 新增 Agent 分组
      tags:
      - Agent
  /v1/agent/main:
    get:
      description: 未找到主 Agent 时返回 500。
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/entities.AgentInfo'
              type: object
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 获取主 Agent 信息失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 获取主 Agent 信息
      tags:
      - Agent
    post:
      consumes:
      - application/json
      description: 名称、描述和提示词为空时使用默认值，智能程度默认为中等。
      parameters:
      - description: 新增主 Agent参数
        in: body
        name: request
        schema:
          $ref: '#/definitions/entities.AddMainAgentReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 为 ID
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 新增主 Agent失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 新增主 Agent
      tags:
      - Agent
  /v1/model:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 模型列表
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/entities.GetModelsRsp'
                  type: array
              type: object
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 查询模型失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 获取模型列表
      tags:
      - 模型
    post:
      consumes:
      - application/json
      description: 创建模型配置，成功后返回模型 ID；新建模型默认禁用。
      parameters:
      - description: 模型配置，provider、name、url、type、context_limit 必填
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.AddModelReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 为模型 ID
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 缺少必填参数
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 创建模型失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 新增模型
      tags:
      - 模型
  /v1/model/{id}:
    get:
      description: 返回指定模型的 API Key 元信息，不包含 API Key 明文。
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API Key 列表
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/entities.ApiKeyInfo'
                  type: array
              type: object
        "400":
          description: 缺少模型 ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 查询 API Key 失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 获取模型的 API Key 列表
      tags:
      - 模型
    put:
      consumes:
      - application/json
      description: 按需更新模型字段；reasoning 的 key 和 value 均非空时才更新深度思考配置。
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: 待更新的模型配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.UpdateModelReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 缺少模型 ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 更新模型失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 更新模型配置
      tags:
      - 模型
  /v1/model/{id}/key:
    post:
      consumes:
      - application/json
      description: 加密保存 API Key，成功后返回 API Key ID；新建 API Key 默认禁用。
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: API Key 配置，key 必填
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.AddApiKeyReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 为 API Key ID
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  type: integer
              type: object
        "400":
          description: 缺少模型 ID 或 API Key
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 新增 API Key 失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 新增模型 API Key
      tags:
      - 模型
  /v1/model/{id}/key/{api}:
    delete:
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: API Key ID，不能为 0
        in: path
        name: api
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 缺少模型 ID 或 API Key ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 删除 API Key 失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 删除模型 API Key
      tags:
      - 模型
    put:
      consumes:
      - application/json
      description: 按需更新名称、权重和启用状态；upgrade 为 true 时使用最新密钥重新加密 API Key。
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: API Key ID，不能为 0
        in: path
        name: api
        required: true
        type: integer
      - description: 待更新的 API Key 配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entities.UpdateApiKeyReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 缺少模型 ID 或 API Key ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证 Cookie 缺失或无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 更新 API Key 失败
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - CookieAuth: []
      summary: 更新模型 API Key
      tags:
      - 模型
  /v1/secret:
    post:
      description: 生成新版本的加密密钥并追加保存到 .env，响应仅返回密钥版本。
      produces:
      - application/json
