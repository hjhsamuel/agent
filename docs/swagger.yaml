  /v1/session/{id}/message:
    get:
      description: 按消息 ID 倒序返回历史消息，使用响应中的 offset 查询下一页。
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      - description: 上一页返回的消息索引，首次查询不传
        in: query
        name: offset
        type: integer
      - description: 最大返回轮次数量，必须大于 0
        in: query
        minimum: 1
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 历史消息列表
          schema:
            allOf:
